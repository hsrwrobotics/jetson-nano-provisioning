# Ansible Configuration File
# This file controls Ansible's behavior

[defaults]
# Where to find the inventory file (so you don't have to specify -i each time)
inventory = inventory.ini

# Force Python 3 on the remote hosts
interpreter_python = /usr/bin/python3.8

# Don't check SSH host keys (useful for development, disable in production)
host_key_checking = False

# Don't create .retry files when playbooks fail
retry_files_enabled = False

# Show warnings about deprecated features
deprecation_warnings = True

# Timeout for SSH connections (in seconds)
timeout = 30
